; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
;
; ------------------------------------------
; Firmware build flags
; - `CHIP_SORTER_LINK_SERIAL_MODE=0` for D0/D1 hardware serial
; - `CHIP_SORTER_LINK_SERIAL_MODE=1` for D12/D13 software serial
; - `CHIP_SORTER_LINK_BAUD` can be overridden if you want a different link speed


[env:Uno-CNC_MotionController]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
	waspinator/AccelStepper @ ^1.64.0
build_flags =
	-D CHIP_SORTER_BAUD=115200
	-D CHIP_SORTER_TEST_LOOP=1
	-D CHIP_SORTER_LINK_SERIAL_MODE=0
	-D CHIP_SORTER_LINK_BAUD=115200
